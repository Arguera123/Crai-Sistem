# Configuración del servidor HTTP (Puerto 80) - Redirección a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name biblioteca.uca.edu.sv www.biblioteca.uca.edu.sv;

    # Redirección permanente (301) de todo el tráfico HTTP a HTTPS
    return 301 https://$host$request_uri;
}

# Configuración del servidor HTTPS (Puerto 443)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name biblioteca.uca.edu.sv www.biblioteca.uca.edu.sv;

    # Rutas a los certificados montados de forma segura
    ssl_certificate /etc/nginx/certs/biblioteca.crt;
    ssl_certificate_key /etc/nginx/certs/biblioteca.key;

    # Configuración de seguridad SSL recomendada
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Compresión Gzip para mejorar la velocidad de carga
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. Frontend: Servir archivos estáticos de la SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Evita errores de "404 Not Found" al recargar páginas usando React Router / Vue Router
        try_files $uri $uri/ /index.html;
    }

    # 2. Backend: Proxy inverso para redirigir peticiones de API
    location /api/ {
        # 'backend' es el nombre del servicio en el archivo docker-compose.yml
        # y el puerto interno que expone el backend (ej. 5000)
        proxy_pass http://backend:5000/;
        
        # Cabeceras estándar para preservar datos de la petición original
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Desactivar caché para respuestas del Backend (API)
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Páginas de error personalizadas (Opcional)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}